<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca en Línea</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stylesRegistrarse.css">
</head>
<body>
    <div class="bank-container">
        <header class="bank-header">
            <div class="logo-container">
                <img src="GRAFICOS BANCA/logo-no-background-01.png" alt="Logo del banco" class="bank-logo">
            </div>
            <div class="user-info">
                <span class="welcome">Bienvenido, <strong>Usuario</strong></span>
                <button class="logout-btn" onclick="window.location.href='../Login.html'">Cerrar sesión</button>
            </div>
        </header>
    
        <div class="container">
            <h2>Registro En Línea</h2>
            <form id="registro-form">
              <div class="input-group">
                <input type="text" placeholder="Nombre Completo" id="nombreCompleto">
                <select id="universidad">
                  <option value="" disabled selected>Universidad de estudio</option>
                  <option value="uni1">UCLA</option>
                  <option value="uni2">UNEXPO</option>
                  <option value="uni3">IUAJS</option>
                  <option value="uni4">IUJO</option>
                  <option value="uni5">IUAM</option>
                </select>
              </div>
              <div class="input-group">
                <input type="email" placeholder="Correo electrónico institucional" id="correo">
                <input type="tel" placeholder="Teléfono de contacto" id="telefono">
              </div>
              <div class="input-group">
                <input type="text" placeholder="Nombre de usuario" id="usuario">
                <input type="password" placeholder="Contraseña" id="contrasena">
              </div>
              <div class="button-group">
                <button type="button" id="limpiar">Limpiar</button>
                <a href="#" id="terminos">Leer términos y condiciones</a>
                <button type="submit" id="registrarse">Registrarse</button>
              </div>
            </form>
          </div>
        
          <script src="scriptRegistrarse.js"></script>
</body>
</html>
