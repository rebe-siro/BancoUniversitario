<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro - Banca en Línea</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="stylesRegistrarse.css">
    </head>
        <body>
            <div class="bank-container">
                <header class="bank-header">
                    <div class="logo-container">
                        <img src="GRAFICOS BANCA/logo-no-background-01.png" alt="Logo del banco" class="bank-logo">
                    </div>
                </header>
                <div class="container">
                    <h2>Registro En Línea</h2>
                    <form id="registro-form">
                        <div class="input-group">
                            <label for="first_name">Nombre</label>
                            <input type="text" placeholder="Nombre" id="first_name" required>
                        </div>
                        <div class="input-group">
                            <label for="last_name">Apellido</label>
                            <input type="text" placeholder="Apellido" id="last_name" required>
                        </div>
                        <div class="input-group">
                            <label for="documento">Número de documento</label>
                            <input type="text" placeholder="Número de documento" id="documento" required>
                        </div>
                        <div class="input-group">
                            <label for="fechaNacimiento">Fecha de nacimiento</label>
                            <input type="date" id="fechaNacimiento" required>
                        </div>
                        <div class="input-group">
                            <label for="telefono">Teléfono de contacto</label>
                            <input type="tel" placeholder="Número de Teléfono" id="telefono" required>
                        </div>
                        <div class="input-group">
                            <label for="correo">Correo electrónico</label>
                            <input type="email" placeholder="Correo electrónico" id="correo" required>
                        </div>
                        <div class="input-group">
                            <label for="contrasena">Contraseña</label>
                            <input type="password" placeholder="Contraseña" id="contrasena" required>
                        </div>
                        <div class="input-group">
                            <label for="contrasena">Confirmar contraseña</label>
                            <input type="password" placeholder="Contraseña" required>
                        </div>
                        <div class="button-group">
                            <button id="volver" onclick="window.location.href='../login.html'">Volver</button>
                            <button id="registrarse">Registrarse</button>
                        </div>
                    </form>
                </div>
                <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
                <script src="scriptRegistrarse.js"></script>
            </div>
        </body>
</html>
