<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca en Línea</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="StyleMBanca.css">
</head>
<body>
        <div class="bank-container">
        <div w3-include-html="menu.html"></div>

        <main class="bank-main">
            <section class="balance-display">
                <div class="account-info">
                    <span class="account-name">Cuenta @xxx_xxxx</span>
                    <span class="account-number">Número de cuenta: 0106****808</span>
                </div>
                <div class="balance-amount">
                    <span class="amount balance-amount-value">$12,345.67</span>
                    <button id="toggleBalance" class="balance-toggle">
                        <i class="fas fa-lock"></i>
                    </button>
                </div>
            </section>

            <section class="transactions-section">
                <div class="transactions-header">
                    <h2>Movimientos</h2>
                </div>
                <div class="transactions-container">
                    <div class="transactions-scroll">
                        <table class="transactions-table">
                            <thead>
                                <tr>
                                    <th>Referencia</th>
                                    <th>Descripción</th>
                                    <th>Fecha</th>
                                    <th>Monto</th>
                                </tr>
                            </thead>
                            <tbody id="transactions-body">
                            <!--Las transacciones se cargarán acá-->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bank-footer">
            <p>© 2023 Tu Banco. Todos los derechos reservados.</p>
        </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scriptMBanca.js"></script>
    <script src="include.js"></script>
</body>
</html>
