<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos | Banca en Línea</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="StyleMBanca.css">
    <link rel="stylesheet" href="stylesRegistrarse.css">
</head>
<body>
    <div class="bank-container">
        <div w3-include-html="menu.html"></div>

        <!-- Vista de Contactos -->
        <main class="contacts-container">
            <div class="contacts-header">
                <h1 class="contacts-title">Contactos Bancarios</h1>
            </div>
            
            <table class="contacts-table">
                <thead>
                    <tr>
                        <th>Alias</th>
                        <th>Número de Cuenta</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-id="1" data-date="2025-05-20T10:30:00Z">
                        <td>Miller Arias</td>
                        <td>34667890123456789012</td>
                        <td>Le encantan los Napolitanos</td>
                        <td class="contact-actions">
                            <button class="btn-action btn-view" title="Ver"><i class="fas fa-eye"></i></button>
                            <button class="btn-action btn-delete" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr data-id="2" data-date="2025-05-21T14:15:00Z">
                        <td>Leonardo DiCaprio</td>
                        <td>45678901234567890123</td>
                        <td>El lobo de PDVSA</td>
                        <td class="contact-actions">
                            <button class="btn-action btn-view" title="Ver"><i class="fas fa-eye"></i></button>
                            <button class="btn-action btn-delete" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Botón flotante para agregar contacto -->
            <button class="add-contact-btn" id="addContactBtn">
                <i class="fas fa-plus"></i>
            </button>
            
            <!-- Modal para Contactos -->
            <div class="modal" id="contactModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="modalTitle">Agregar Nuevo Contacto</h2>
                        <button class="close-modal">&times;</button>
                    </div>
                    
                    <div class="modal-body" id="modalBody">
                        <!-- Formulario para agregar/editar -->
                        <form id="contactForm" class="modal-form">
                            <div class="form-group">
                                <label for="contactAlias">Alias</label>
                                <input type="text" id="contactAlias" name="alias" required>
                            </div>
                            <div class="form-group">
                                <label for="contactAccount">Número de Cuenta</label>
                                <input type="text" id="contactAccount" name="account" required>
                            </div>
                            <div class="form-group">
                                <label for="contactDescription">Descripción</label>
                                <textarea id="contactDescription" name="description" required></textarea>
                            </div>
                            <input type="hidden" id="contactId">
                            
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                                <button type="submit" class="btn btn-primary" id="submitBtn">Guardar</button>
                            </div>
                        </form>
                        
                        <!-- Vista de detalles -->
                        <div id="viewContent" class="contact-view" style="display:none;">
                            <div class="contact-info">
                                <label>Alias:</label>
                                <p id="viewAlias"></p>
                            </div>
                            <div class="contact-info">
                                <label>Número de Cuenta:</label>
                                <p id="viewAccount"></p>
                            </div>
                            <div class="contact-info">
                                <label>Descripción:</label>
                                <p id="viewDescription"></p>
                            </div>
                            <div class="contact-info">
                                <label>Fecha de Registro:</label>
                                <p id="viewDate"></p>
                            </div>
                            
                            <div class="modal-actions view-actions">
                                <button class="btn-edit-view" id="editViewBtn">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn btn-secondary" id="closeViewBtn">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bank-footer">
            <p>© 2025 Banco Universitario. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="scriptMBanca.js"></script>
    <script src="include.js"></script>
    <script src="ContactosM.js"></script>
</body>
</html>
