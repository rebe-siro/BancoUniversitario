<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesLogin.css">

    
</head>

<body>

    <div class="gradient-view">
        <section id ="login-section"> 
                <div class="login-container" >
            
                    <img src="GRAFICO\logo-no-background.png" alt="LogoBancoUniversitario"/> <br>
                            
                <form id="loginForm">
                
                        <div class="input-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="text" id="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>               
                
                </form>
                            <br>   
                            <div class="links">
                            <!-- <a href="#" id="olvide-contrasena">¿Olvidaste tu contraseña?</a> <br> -->
                            <a href="Banca en Linea/Registrarse.html" id="registro">Registrate aqui si aun no tienes usuario</a>
                            </div>
                    <center>
                    <button type="button" class="btn-entrar" onclick="window.location.href='Banca en linea/movimientos.html'"> Entrar</button>
                    </center>       
                </div>
            
                <div class="image-container"></div> 
        
        </section>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="scriptLogin.js"></script>
    </div>
      
    
</body>
</html>
